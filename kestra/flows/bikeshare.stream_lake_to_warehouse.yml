id: stream_lake_to_warehouse
namespace: bikeshare
description: |
  **Streaming -> warehouse: micro-batch the streaming data into the warehouse.**
  The Kafka lake consumer continuously writes Parquet files to
  s3://bikeshare-lake/streaming/station_status/. Every hour this flow loads the
  new files (dlt filesystem source, incremental on modification date) and
  rebuilds the station availability mart.

labels:
  project: bikeshare
  layer: streaming

concurrency:
  limit: 1

variables:
  pipeline_env:
    PG_HOST: "{{ envs.pg_host }}"
    PG_PORT: "{{ envs.pg_port }}"
    PG_DATABASE: "{{ envs.pg_database }}"
    PG_USER: "{{ envs.pg_user }}"
    PG_PASSWORD: "{{ envs.pg_password }}"
    S3_ENDPOINT: "{{ envs.s3_endpoint }}"
    S3_ACCESS_KEY: "{{ envs.s3_access_key }}"
    S3_SECRET_KEY: "{{ envs.s3_secret_key }}"
    LAKE_BUCKET: "{{ envs.lake_bucket }}"

tasks:
  - id: dlt_load_lake_files
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bikeshare-pipelines:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      networkMode: bikeshare-net
    env: "{{ render(vars.pipeline_env | toJson) }}"
    commands:
      - python -m bikeshare.warehouse.bootstrap
      - python -m bikeshare.ingestion.dlt_lake_status

  - id: dbt_build_availability
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bikeshare-pipelines:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      networkMode: bikeshare-net
    env: "{{ render(vars.pipeline_env | toJson) }}"
    commands:
      - cd /app/dbt
      - dbt build --select @source:raw_stream @source:live

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "5 * * * *"

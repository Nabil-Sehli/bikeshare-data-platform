name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install uv && uv pip install --system -r docker/pipelines/requirements.lock
      - name: Lint
        run: ruff check src dashboard tests
      - name: Unit tests (incl. Spark transformations)
        run: pytest -q

  dbt:
    runs-on: ubuntu-latest
    env:
      PG_USER: ci
      PG_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "dbt-core==1.11.*" "dbt-postgres==1.11.0"
      - name: dbt parse (compiles every model, test and macro without a database)
        working-directory: dbt
        run: dbt parse --profiles-dir . --no-partial-parse

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
      - working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose build pipelines
